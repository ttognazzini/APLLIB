# ---------------------------------------------------------------------
# APLLIBGUI  IBM HTTP Server (Apache) instance configuration
#
# Serves the built Vue site from the IFS and dispatches /api/* to the
# single CGI program APLLIB/APIDSP, running each request AS the
# authenticated user (RULES.md S1/S3).
#
# Install: place at /www/apllibgui/conf/httpd.conf, put the built dist/
# in /www/apllibgui/htdocs, register instance APLLIBGUI, then
#   STRTCPSVR SERVER(*HTTP) HTTPSVR(APLLIBGUI)
#
# TLS (RULES.md S6): required in production  assign a certificate via
# DCM and add the SSLEnable/SSLAppName directives for this instance
# (or front this instance with the shop's existing TLS reverse proxy).
# ---------------------------------------------------------------------

Listen *:8500
DocumentRoot /www/apllibgui/htdocs

# CGI I/O: Apache converts between the job CCSID and UTF-8.
# DefaultFsCCSID pins the server/CGI job CCSID to a real EBCDIC CCSID 
# REQUIRED on systems where QCCSID is 65535 (*HEX): the Db2 JSON
# functions produce UTF-8 (1208) and cannot convert to/from 65535.
DefaultFsCCSID 37
DefaultNetCCSID 1208
CgiConvMode %%EBCDIC/EBCDIC%%

# --- Static SPA -------------------------------------------------------
<Directory /www/apllibgui/htdocs>
    Require all granted
</Directory>

# Vue Router uses history-mode URLs (/segments, /files, )  serve the
# app shell for any path that isn't a real file. API and assets are
# matched by their own rules first.
FallbackResource /index.html

# Long-cache fingerprinted build assets
<LocationMatch ^/assets/>
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# --- API: one CGI dispatcher ------------------------------------------
# /api/segments/list  APIDSP with PATH_INFO=/segments/list
ScriptAlias /api /qsys.lib/apllib.lib/apidsp.pgm

# Library list for the CGI jobs. QTMHHTTP's default *LIBL has no APLLIB,
# so *LIBL-qualified service-program references (e.g. YAJL) fail at
# activation with MCH3401 without this.
SetEnv QIBM_CGI_LIBRARY_LIST "QTEMP;APLLIB;YAJL"

<Directory /qsys.lib/apllib.lib>
    # Authenticate against real IBM i user profiles
    AuthType Basic
    AuthName "APLLIB - sign on with your IBM i user profile"
    PasswdFile %%SYSTEM%%
    Require valid-user
    # and run the CGI job AS that user (the CGI equivalent of IWS
    # *AUTHENTICATED). Object authority is enforced by the OS on every
    # request; a wrong password gets 401 before any program runs.
    UserID %%CLIENT%%
</Directory>

